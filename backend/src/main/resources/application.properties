# 服务端口
server.port=8080

# ========= Qwen3.6-Plus / Alibaba Cloud Model Studio =========
# 使用 OpenAI-compatible Chat Completions。
# 真实 API Key 只通过本机环境变量 MODEL_API_KEY 提供，不要提交到 GitHub。
#
# 默认使用北京地域的兼容接口；如果你的 API Key 创建在其他地域，
# 请通过 MODEL_BASE_URL 覆盖成对应地域的完整 /chat/completions 地址。
model.base-url=${MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
model.api-key=${MODEL_API_KEY:}
model.name=${MODEL_NAME:qwen3.6-plus}

# HTTP 超时
model.connect-timeout-seconds=10
model.request-timeout-seconds=90
