# 服务端口
server.port=8080

# ========= 大模型 API 配置 =========
# 默认使用 DeepSeek 的 OpenAI-compatible Chat Completions 接口。
# 真实 API Key 只通过本机环境变量 MODEL_API_KEY 提供。
model.base-url=${MODEL_BASE_URL:https://api.deepseek.com/chat/completions}
model.api-key=${MODEL_API_KEY:}
model.name=${MODEL_NAME:deepseek-flash}

# HTTP 超时
model.connect-timeout-seconds=10
model.request-timeout-seconds=90
