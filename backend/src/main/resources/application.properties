# 服务端口
server.port=8080

# ========= DeepSeek API 配置 =========
# 使用 DeepSeek 官方 OpenAI-compatible Chat Completions 接口。
# 真实 API Key 只通过本机环境变量 MODEL_API_KEY 提供，不要提交到 GitHub。
#
# 当前官方推荐的文本模型名：
# deepseek-flash = DeepSeek-V4.1-Flash
# 官方 Base URL：https://api.deepseek.com
# 本项目的 ChatService 直接 POST 到 /chat/completions，
# 因此这里配置完整接口地址。

model.base-url=${MODEL_BASE_URL:https://api.deepseek.com/chat/completions}
model.api-key=${MODEL_API_KEY:}
model.name=${MODEL_NAME:deepseek-flash}

# HTTP 超时
model.connect-timeout-seconds=10
model.request-timeout-seconds=90
