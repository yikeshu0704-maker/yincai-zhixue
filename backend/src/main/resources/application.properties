# 服务端口
server.port=8080

# ========= 大模型 API 配置 =========
# 真实 API Key 只通过本机环境变量提供，不要写进 GitHub。
# 使用 OpenAI-compatible Chat Completions 风格接口。

model.base-url=${MODEL_BASE_URL:https://api.openai.com/v1/chat/completions}
model.api-key=${MODEL_API_KEY:}
model.name=${MODEL_NAME:}

model.connect-timeout-seconds=10
model.request-timeout-seconds=90
